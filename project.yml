name: EZRsvp
options:
  bundleIdPrefix: app.ezrsvp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  EZRsvp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.ezrsvp.EZRsvp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    # ───────────────────────────────────────────────────────────────────
    # OPTIONAL: Supabase. The app builds & runs WITHOUT this (demo mode).
    # To enable the live backend, uncomment the dependency below, run
    # `xcodegen generate`, fill in AppConfig.supabaseURL / supabaseAnonKey,
    # and set AppConfig.useSupabase = true. See README.md.
    # ───────────────────────────────────────────────────────────────────
    # dependencies:
    #   - package: Supabase
    #     product: Supabase

# packages:
#   Supabase:
#     url: https://github.com/supabase/supabase-swift
#     from: "2.0.0"
